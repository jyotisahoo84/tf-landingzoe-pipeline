trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  terraformWorkingDirectory: 'Terraform_Module_Security_Scan_09082026/environment/Preprod'
  terraformVersion: '1.9.8'
  azureServiceConnection: 'azure-terraform-connection'

stages:

# ============================================================
# TERRAFORM PLAN
# ============================================================

- stage: TerraformPlan
  displayName: 'Terraform Plan'

  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Plan'

    steps:

    # ========================================================
    # Checkout
    # ========================================================

    - checkout: self
      displayName: 'Checkout Code'

    # ========================================================
    # Install Terraform
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Install Terraform'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          echo "Installing Terraform $(terraformVersion)..."

          sudo apt-get update
          sudo apt-get install -y unzip wget

          wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip

          unzip -o terraform_$(terraformVersion)_linux_amd64.zip

          sudo mv terraform /usr/local/bin/terraform

          terraform version

    # ========================================================
    # Azure Login Check
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Check Azure Login'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          echo "Azure account information:"
          az account show

    # ========================================================
    # Terraform Init
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(terraformWorkingDirectory)'
        inlineScript: |
          set -e

          terraform init -input=false

    # ========================================================
    # Terraform Validate
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Terraform Validate'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(terraformWorkingDirectory)'
        inlineScript: |
          set -e

          terraform validate

    # ========================================================
    # Terraform Format Check
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Terraform Format Check'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(terraformWorkingDirectory)'
        inlineScript: |
          set -e

          terraform fmt -check -recursive

    # ========================================================
    # Terraform Plan
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(terraformWorkingDirectory)'
        inlineScript: |
          set -e

          terraform plan \
            -input=false \
            -var-file=terraform.tfvars \
            -out=tfplan

    # ========================================================
    # Publish Terraform Plan
    # ========================================================

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(terraformWorkingDirectory)/tfplan'
        artifact: 'terraform-plan'


# ============================================================
# TERRAFORM APPLY
#
# Apply ONLY on main branch
# ============================================================

- stage: TerraformApply
  displayName: 'Terraform Apply'

  dependsOn:
  - TerraformPlan

  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:

  - deployment: TerraformApply
    displayName: 'Terraform Apply'

    environment: 'production'

    strategy:
      runOnce:
        deploy:

          steps:

          # ==================================================
          # Checkout
          # ==================================================

          - checkout: self
            displayName: 'Checkout Code'

          # ==================================================
          # Download Terraform Plan
          # ==================================================

          - download: current
            artifact: terraform-plan
            displayName: 'Download Terraform Plan'

          # ==================================================
          # Install Terraform
          # ==================================================

          - task: AzureCLI@2
            displayName: 'Install Terraform'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                echo "Installing Terraform $(terraformVersion)..."

                sudo apt-get update
                sudo apt-get install -y unzip wget

                wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip

                unzip -o terraform_$(terraformVersion)_linux_amd64.zip

                sudo mv terraform /usr/local/bin/terraform

                terraform version

          # ==================================================
          # Azure Login Check
          # ==================================================

          - task: AzureCLI@2
            displayName: 'Check Azure Login'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                echo "Azure account information:"
                az account show

          # ==================================================
          # Terraform Init
          # ==================================================

          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(terraformWorkingDirectory)'
              inlineScript: |
                set -e

                terraform init -input=false

          # ==================================================
          # Terraform Apply
          # ==================================================

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(terraformWorkingDirectory)'
              inlineScript: |
                set -e

                echo "Applying Terraform plan..."

                terraform apply \
                  -input=false \
                  -auto-approve \
                  "$(Pipeline.Workspace)/terraform-plan/tfplan"

                echo "Terraform Apply completed successfully."