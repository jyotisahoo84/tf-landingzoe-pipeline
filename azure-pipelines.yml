trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  terraformWorkingDirectory: 'Terraform_Module_Security_Scan_09082026/environment/Preprod'
  terraformVersion: '1.9.8'
  azureServiceConnection: 'azure-terraform-connection'

stages:

# ============================================================
# TERRAFORM PLAN
# ============================================================

- stage: TerraformPlan
  displayName: 'Terraform Plan'

  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Plan'

    steps:

    # --------------------------------------------------------
    # Checkout
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Code'

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Install Terraform'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          echo "Installing Terraform $(terraformVersion)..."

          sudo apt-get update
          sudo apt-get install -y unzip wget

          wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip

          unzip -o terraform_$(terraformVersion)_linux_amd64.zip

          sudo mv terraform /usr/local/bin/terraform

          terraform version

    # --------------------------------------------------------
    # Azure Login Check
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Check Azure Login'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Azure account information:"
          az account show

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(terraformWorkingDirectory)'
        inlineScript: |
          terraform init -input=false

    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Validate'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(terraformWorkingDirectory)'
        inlineScript: |
          terraform validate

    # --------------------------------------------------------
    # Terraform Format Check
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Format Check'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(terraformWorkingDirectory)'
        inlineScript: |
          terraform fmt -check -recursive

    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(terraformWorkingDirectory)'
        inlineScript: |
          terraform plan \
            -input=false \
            -var-file=terraform.tfvars


# ============================================================
# TERRAFORM APPLY
# ONLY MAIN BRANCH
# ============================================================

- stage: TerraformApply
  displayName: 'Terraform Apply'

  dependsOn:
    - TerraformPlan

  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:

  - deployment: TerraformApply
    displayName: 'Terraform Apply'

    environment: 'production'

    strategy:
      runOnce:
        deploy:

          steps:

          # --------------------------------------------------
          # Checkout
          # --------------------------------------------------

          - checkout: self
            displayName: 'Checkout Code'

          # --------------------------------------------------
          # Install Terraform
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Install Terraform'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                echo "Installing Terraform $(terraformVersion)..."

                sudo apt-get update
                sudo apt-get install -y unzip wget

                wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip

                unzip -o terraform_$(terraformVersion)_linux_amd64.zip

                sudo mv terraform /usr/local/bin/terraform

                terraform version

          # --------------------------------------------------
          # Azure Login Check
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Check Azure Login'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az account show

          # --------------------------------------------------
          # Terraform Init
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(terraformWorkingDirectory)'
              inlineScript: |
                terraform init -input=false

          # --------------------------------------------------
          # Terraform Validate
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Validate'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(terraformWorkingDirectory)'
              inlineScript: |
                terraform validate

          # --------------------------------------------------
          # Terraform Apply
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(terraformWorkingDirectory)'
              inlineScript: |
                terraform apply \
                  -input=false \
                  -auto-approve \
                  -var-file=terraform.tfvars