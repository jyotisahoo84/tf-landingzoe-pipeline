trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  terraformWorkingDirectory: 'Terraform_Module_Security_Scan_09082026/environment/Preprod'
  terraformVersion: '1.9.8'
  azureServiceConnection: 'azure-terraform-connection'

stages:

# ============================================================
# TERRAFORM PLAN
# ============================================================

- stage: TerraformPlan
  displayName: 'Terraform Plan'

  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Plan'

    steps:

    - checkout: self
      displayName: 'Checkout Code'

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: TerraformCLI@2
      displayName: 'Terraform Init'
      inputs:
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'
        backendType: 'azurerm'
        backendAzureRmSubscriptionId: 'YOUR-SUBSCRIPTION-ID'
        backendAzureRmResourceGroupName: 'YOUR-TFSTATE-RG'
        backendAzureRmStorageAccountName: 'YOUR-TFSTATE-STORAGE'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformCLI@2
      displayName: 'Terraform Validate'
      inputs:
        command: 'validate'
        workingDirectory: '$(terraformWorkingDirectory)'

    - task: TerraformCLI@2
      displayName: 'Terraform Plan'
      inputs:
        command: 'plan'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-var-file=terraform.tfvars'


# ============================================================
# TERRAFORM APPLY
# ============================================================

- stage: TerraformApply
  displayName: 'Terraform Apply'

  dependsOn: TerraformPlan

  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - deployment: TerraformApply
    displayName: 'Terraform Apply'

    environment: 'production'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self
            displayName: 'Checkout Code'

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformCLI@2
            displayName: 'Terraform Init'
            inputs:
              command: 'init'
              workingDirectory: '$(terraformWorkingDirectory)'
              backendType: 'azurerm'
              backendAzureRmSubscriptionId: 'YOUR-SUBSCRIPTION-ID'
              backendAzureRmResourceGroupName: 'YOUR-TFSTATE-RG'
              backendAzureRmStorageAccountName: 'YOUR-TFSTATE-STORAGE'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformCLI@2
            displayName: 'Terraform Validate'
            inputs:
              command: 'validate'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformCLI@2
            displayName: 'Terraform Apply'
            inputs:
              command: 'apply'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-var-file=terraform.tfvars -auto-approve'