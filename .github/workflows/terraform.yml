name: Terraform Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # TERRAFORM PLAN
  # ============================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Terraform_Module_Security_Scan_09082026/environment/Preprod

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure Login
        run: az account show

      # --------------------------------------------------------
      # Terraform checks
      # --------------------------------------------------------

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false


  # ============================================================
  # TERRAFORM APPLY
  # ONLY MAIN BRANCH
  # ============================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    # Apply ONLY when the workflow is running because of
    # a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - terraform-plan

    environment: production
      #name: production

    defaults:
      run:
        working-directory: Terraform_Module_Security_Scan_09082026/environment/Preprod

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure Login
        run: az account show

      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve